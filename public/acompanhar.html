<script>try{var q=location.search,t=localStorage.getItem("ge_tema");if(/[?&]tema=claro/.test(q)){t="claro";localStorage.setItem("ge_tema",t)}else if(/[?&]tema=escuro/.test(q)){t="escuro";localStorage.setItem("ge_tema",t)}if(t!=="claro")document.documentElement.classList.add("dark")}catch(e){document.documentElement.classList.add("dark")}</script>

<style>
.ac{min-height:70vh;padding-block:clamp(32px,6vw,72px)}
.ac-login{max-width:520px;display:flex;flex-direction:column;gap:16px}
.ac-login h1{font-size:var(--t-2xl)}
.ac-login form{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ac-in{width:100%;min-height:56px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.ac-msg{font-size:var(--t-sm);color:var(--ink-2)}
.ac-msg.err{color:#C0392B}
.ac-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ac-head h1{font-size:var(--t-2xl)}
.ac-proj{border-radius:var(--r-lg);background:var(--card);padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:20px}
.ac-proj+.ac-proj{margin-top:12px}
.ac-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ac-top h2{font-size:var(--t-xl);font-weight:400}
.ac-badge{padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:var(--t-xs);font-weight:500;white-space:nowrap}
.ac-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;list-style:none;margin:0;padding:0}
.ac-steps li{display:flex;flex-direction:column;gap:8px;font-size:var(--t-xs);color:var(--ink-3)}
.ac-steps li::before{content:"";height:6px;border-radius:6px;background:var(--line)}
.ac-steps li.done{color:var(--ink-2)}.ac-steps li.done::before{background:var(--ink-3)}
.ac-steps li.now{color:var(--ink);font-weight:500}.ac-steps li.now::before{background:var(--accent-ink)}
.ac-steps small{display:block;font-weight:400;color:var(--ink-3)}
.ac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ac-k{padding:16px;border-radius:16px;background:var(--bg)}
.ac-k small{display:block;font-size:var(--t-xs);color:var(--ink-2)}
.ac-k b{font-weight:300;font-size:var(--t-xl);letter-spacing:-.02em}
.ac-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}.ac-bar i{display:block;height:100%;background:var(--accent-ink)}
.ac-del{display:flex;flex-direction:column;gap:14px;padding:clamp(18px,3vw,28px);border-radius:var(--r-md,20px);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.ac-del h3{font-size:var(--t-lg);margin:0}
.ac-cert{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--card)}
.ac-cert b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
.ac-recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ac-recs li{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;font-size:var(--t-sm);line-height:1.5}
.ac-recs li::before{content:"";grid-row:span 2;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--accent,#C5DD63)}
.ac-recs small{color:var(--ink-2)}
.ac-hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-3);word-break:break-all}
.ac-list{margin:0;padding-left:18px;font-size:var(--t-sm);line-height:1.6}
.ac-files{display:flex;flex-direction:column;gap:6px}
.ac-files a{display:flex;justify-content:space-between;gap:12px;min-height:52px;align-items:center;padding:10px 16px;border-radius:14px;background:var(--bg);text-decoration:none}
.ac-files a span{color:var(--ink-2);font-size:var(--t-xs);white-space:nowrap}
.ac-h3{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.ac-act{display:flex;flex-wrap:wrap;gap:8px}
.ac-proj .btn:not(.dark){background:var(--bg)}
html.dark .ac-proj .btn:not(.dark){background:var(--card-2)}
@media (max-width:560px){.ac-steps{grid-template-columns:repeat(5,minmax(0,1fr))}.ac-steps li{font-size:.6875rem}}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap">
  <a class="logo" href="/" aria-label="Gustavo Elian, início"></a>
  <div class="top-r"><button class="theme-sw" type="button" aria-label="Versão escura" aria-pressed="true"><span class="tr"><span class="kn"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span></span></button><a class="btn" href="/">Voltar ao site</a></div>
</div></header>
<main class="ac"><div class="wrap" id="ac"></div></main>
<footer class="foot"><div class="wrap"><span>© 2026 Gustavo Elian · gustavoelian.com</span><i class="olab" role="img" aria-label="ol@b criativo"></i></div></footer>

<script src="/theme.js" defer></script>
<script src="/hold.js" defer></script>
</body>
</html>
