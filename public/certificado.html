<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>Certificado de autoria · Gustavo Elian</title>
<meta name="robots" content="noindex">
<meta name="description" content="Verificação pública de certificado de autoria e cessão de direitos.">
<meta property="og:title" content="Gustavo Elian · design, web e pesquisa">
<meta property="og:description" content="Sites, sistemas, identidades visuais, campanhas e eventos.">
<meta property="og:type" content="website">
<meta property="og:image" content="/img/thumbs/fazenda-encantada-loja.webp">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/LTWave-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/LTWave-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/mockups.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/site-dark.css">
<script>try{var q=location.search,t=localStorage.getItem("ge_tema");if(/[?&]tema=claro/.test(q)){t="claro";localStorage.setItem("ge_tema",t)}else if(/[?&]tema=escuro/.test(q)){t="escuro";localStorage.setItem("ge_tema",t)}if(t!=="claro")document.documentElement.classList.add("dark")}catch(e){document.documentElement.classList.add("dark")}</script>

<style>
.cert{min-height:70vh;padding-block:clamp(28px,6vw,64px)}
.cert-doc{max-width:760px;margin:0 auto;padding:clamp(24px,5vw,56px);border-radius:28px;background:var(--card);display:flex;flex-direction:column;gap:20px}
.cert-doc h1{font-size:clamp(1.75rem,4.4vw,2.5rem);line-height:1.1;margin:0}
.cert-ok{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;font-size:var(--t-sm);font-weight:500;background:#E6F2C4;color:#2F3A0C}
.cert-ok.bad{background:#FBE0DD;color:#7A1F14}
.cert-doc p{line-height:1.65;margin:0}
.cert-kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:var(--t-sm)}
.cert-kv dt{color:var(--ink-2)}.cert-kv dd{margin:0}
.cert-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;word-break:break-all;color:var(--ink-2)}
.cert-files{display:flex;flex-direction:column;gap:8px}
.cert-files div{padding:10px 14px;border-radius:12px;background:var(--bg)}
.cert-act{display:flex;flex-wrap:wrap;gap:10px}
.cert-sign{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line);font-size:var(--t-sm)}
@media print{.top,.foot,.cert-act,.theme-sw{display:none!important}html,body{background:#fff!important;color:#000!important}.cert-doc{background:#fff;padding:0}.cert{padding:0}}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap">
  <a class="logo" href="/" aria-label="Gustavo Elian, início"></a>
  <div class="top-r"><button class="theme-sw" type="button" aria-label="Versão escura" aria-pressed="true"><span class="tr"><span class="kn"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span></span></button><a class="btn" href="/acompanhar">Área do cliente</a></div>
</div></header>
<main class="cert"><div class="wrap" id="cert"><p class="muted">Verificando certificado…</p></div></main>
<footer class="foot"><div class="wrap"><span>© 2026 Gustavo Elian · gustavoelian.com</span><i class="olab" role="img" aria-label="ol@b criativo"></i></div></footer>
<script src="/certificado.js" defer></script>
<script src="/theme.js" defer></script>
<script src="/hold.js" defer></script>
</body>
</html>
