name = "gustavoelian"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "gustavoelian-dados"

[alias]
"@netlify/blobs" = "./blobs.ts"
"@resvg/resvg-js" = "./resvg.ts"
"node:fs" = "./fs-stub.ts"

[observability]
enabled = true
